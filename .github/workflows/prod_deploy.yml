# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App Production (Service wildlifeaid2)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build_test_ci.yml
    with:
      deploy: true

  release:
    runs-on: ubuntu-latest
    needs: build
    env:
      ARTIFACT_ZIP_NAME: ${{ needs.build.outputs.artifcat_name }}.zip
    permissions:
      contents: write #This is required for the release action
      
    steps:
      - name: Download artifact from build job
        id: artifact_download
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifcat_name }}
          path: app

      - name: Zip artifact for release
        run: zip -r ${{ env.ARTIFACT_ZIP_NAME }} ./app

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: true
          name: ${{ needs.build.outputs.version }}
          tag_name: ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: ${{ env.ARTIFACT_ZIP_NAME }}
          target_commitish: ${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: azure_pord
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifcat_name }}
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'wildlifeaid2'
          slot-name: 'Production'
          package: .

      - name: Deploy EF Core migration bundle
        id: deploy-to-db
        if: ${{ success() }}
        run: |
          export ConnectionStrings__DataDb='Fake ConnStr' &&
          chmod +x ${{ vars.DOTNET_EF_BUNDLE_NAME }} &&
          ${{ vars.DOTNET_EF_BUNDLE_NAME }} --connection '${{ secrets.AZUREAPPSERVICE_DBCONNSTR }}'