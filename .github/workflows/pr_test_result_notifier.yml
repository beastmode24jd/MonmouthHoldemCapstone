# WARNING: This workflow/action can only be run on the main repo (jmcshane22/MonmouthHoldemCapstone)
# Fires when the complete test suite finishes. If the run was triggered by
# manual_pr_test_run.yml (branch matches ci/pr-trigger-*), updates the PR
# commit status and replaces the "Tests running..." comment with the result.
name: PR Test Result Notifier

on:
  workflow_run:
    workflows: ["Run Complete Test Suite (All Tests)"]
    types: [completed]

permissions:
  statuses: write    # Post final commit status to the PR head SHA
  issues: write      # Update the PR comment posted by the dispatch step

jobs:
  notify:
    name: Post Test Result to PR
    if: >
      github.repository == 'jmcshane22/MonmouthHoldemCapstone' &&
      startsWith(github.event.workflow_run.head_branch, 'ci/pr-trigger-')
    runs-on: ubuntu-latest
    steps:
      - name: Update PR commit status and comment with result
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = context.payload.workflow_run.head_branch;
            const match = branch.match(/^ci\/pr-trigger-(\d+)$/);
            if (!match) {
              core.info('Branch does not match ci/pr-trigger-* pattern — skipping');
              return;
            }

            const prNumber = parseInt(match[1]);
            const run = context.payload.workflow_run;
            const conclusion = run.conclusion;   // 'success', 'failure', 'cancelled', etc.
            const runUrl = run.html_url;
            const sha = run.head_sha;

            const isSuccess = conclusion === 'success';
            const icon = isSuccess ? '✅' : '❌';
            const statusState = isSuccess ? 'success' : 'failure';
            const statusDesc = isSuccess ? 'All tests passed' : `Tests ${conclusion}`;

            // Update the commit status so it resolves in the PR checks area
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: statusState,
              context: 'Manual Test Suite',
              description: statusDesc,
              target_url: runUrl
            });
            core.info(`Posted commit status '${statusState}' for ${sha}`);

            // Find the pending comment posted by the dispatch step and update it
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });

            const triggerComment = comments
              .reverse()
              .find(c =>
                c.user.login === 'github-actions[bot]' &&
                c.body.includes('Manual Test Suite Triggered')
              );

            const resultBody = [
              `## ${icon} Manual Test Suite ${isSuccess ? 'Passed' : 'Failed'}`,
              '',
              `**[View Run →](${runUrl})**`,
              '',
              `Conclusion: \`${conclusion}\``
            ].join('\n');

            if (triggerComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: triggerComment.id,
                body: resultBody
              });
              core.info(`Updated comment ${triggerComment.id} on PR #${prNumber}`);
            } else {
              // Fallback: dispatch comment wasn't found (e.g. run found too late), post fresh
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: resultBody
              });
              core.info(`Posted new result comment on PR #${prNumber}`);
            }
