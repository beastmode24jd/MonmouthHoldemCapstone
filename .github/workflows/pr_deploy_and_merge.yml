# WARNING: This workflow/action can only be run on the main repo (jmcshane22/MonmouthHoldemCapstone)
# Triggered when a PR targeting dev or main is approved and up-to-date.
# Requires both a human approval and a github-actions[bot] CI approval to deploy.
# If the bot hasn't approved yet, tests are run inline and the bot review is posted from this workflow.
# If the bot has already approved (e.g. via label-triggered CI), tests are skipped and deploy proceeds immediately.
# Bot reviews do NOT re-trigger this workflow (filtered in check_conditions).
# Required status check to configure in branch protection: "PR Deploy and Auto-Merge / Deploy to Environment"
name: PR Deploy and Auto-Merge

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  actions: write
  pull-requests: write
  issues: write

jobs:
  check_conditions:
    name: Check PR Approval and Readiness
    if: github.repository == 'jmcshane22/MonmouthHoldemCapstone'
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      deploy_env: ${{ steps.check.outputs.deploy_env }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
      bot_approved: ${{ steps.check.outputs.bot_approved }}
    steps:
      - name: Evaluate PR approval state and merge readiness
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Exit early if triggered by the bot's own review — prevents a deploy loop
            // where the bot posting APPROVE would re-kick this workflow.
            if (context.eventName === 'pull_request_review') {
              const reviewer = context.payload.review?.user?.login;
              if (reviewer === 'github-actions[bot]') {
                core.setOutput('should_deploy', 'false');
                core.info('Skipping — triggered by github-actions[bot] review');
                return;
              }
            }

            const prNumber = context.payload.pull_request.number;
            const baseBranch = context.payload.pull_request.base.ref;

            if (baseBranch !== 'dev' && baseBranch !== 'main') {
              core.setOutput('should_deploy', 'false');
              core.info(`Skipping — base branch '${baseBranch}' is not dev or main`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            if (pr.draft) {
              core.setOutput('should_deploy', 'false');
              core.info('Skipping — PR is a draft');
              return;
            }

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            // Track latest review state per reviewer (list is ordered oldest→newest)
            const latestByUser = {};
            for (const r of reviews) {
              latestByUser[r.user.login] = r.state;
            }

            // Human approval: any non-bot reviewer with APPROVED as their latest state.
            // Enable "Dismiss stale pull request approvals when new commits are pushed" in
            // branch protection to automatically invalidate these on push.
            const humanApproved = Object.entries(latestByUser)
              .some(([user, state]) => user !== 'github-actions[bot]' && state === 'APPROVED');
            const botApproved = latestByUser['github-actions[bot]'] === 'APPROVED';

            // 'behind' = base has commits the PR head does not; 'dirty' = merge conflict
            const isReady = humanApproved &&
              pr.mergeable_state !== 'behind' &&
              pr.mergeable_state !== 'dirty';

            const deployEnv = baseBranch === 'main' ? 'azure_prod' : 'azure_staging';
            const isPrerelease = baseBranch !== 'main';

            core.setOutput('should_deploy', isReady.toString());
            core.setOutput('bot_approved', botApproved.toString());
            core.setOutput('deploy_env', deployEnv);
            core.setOutput('is_prerelease', isPrerelease.toString());
            core.info(`PR #${prNumber} — human: ${humanApproved}, bot: ${botApproved}, mergeable_state: ${pr.mergeable_state}, env: ${deployEnv}, will deploy: ${isReady}`);

  test:
    name: Full Test Suite
    needs: check_conditions
    if: >
      needs.check_conditions.outputs.should_deploy == 'true' &&
      needs.check_conditions.outputs.bot_approved != 'true'
    uses: ./.github/workflows/test_suite_complete_run.yml
    secrets: inherit
    permissions:
      contents: read
      actions: write
      id-token: write

  post_bot_review:
    name: Post Bot CI Review
    needs: [check_conditions, test]
    if: >
      always() &&
      needs.check_conditions.outputs.should_deploy == 'true' &&
      needs.check_conditions.outputs.bot_approved != 'true' &&
      needs.test.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Submit bot review based on test result
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const testPassed = '${{ needs.test.result }}' === 'success';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const event = testPassed ? 'APPROVE' : 'REQUEST_CHANGES';
            const body  = testPassed
              ? '✅ All tests passed. Approving on behalf of CI.'
              : `❌ Tests failed. Please review the [run](${runUrl}) and fix all failures before merging.`;

            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event,
                body
              });
              core.info(`Submitted '${event}' review on PR #${prNumber}`);
            } catch (err) {
              core.setFailed(`Could not submit review: ${err.message}`);
            }

  publish:
    name: Publish
    needs: [check_conditions, test, post_bot_review]
    if: >
      always() &&
      needs.check_conditions.outputs.should_deploy == 'true' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.post_bot_review.result == 'success' || needs.post_bot_review.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      version: ${{ steps.get_build_version.outputs.version }}
      artifact_name: ${{ vars.FILEPATH_SAFE_APPNAME }}_v${{ steps.get_build_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Get build version
        id: get_build_version
        run: |
          version="$(date +%Y).$(date +%-m).${{ github.run_number }}.${{ github.run_attempt }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pin .NET SDK to 9.0.x
        run: echo '{"sdk":{"version":"9.0.312","rollForward":"latestPatch"}}' > global.json

      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef --version ${{ vars.DOTNET_EF_VERSION }}

      - name: Restore packages for publish
        run: dotnet restore ./src --no-dependencies --verbosity ${{ vars.DOTNET_VERBOSE_LVL }}

      - name: Publish
        run: |
          dotnet publish ./src/MH.Capstone.WebApp --no-restore --configuration Release --verbosity ${{ vars.DOTNET_VERBOSE_LVL }} \
            -p:Version=${{ steps.get_build_version.outputs.version }} \
            -o "${{ vars.PUBLISH_ROOT_DIR }}/${{ vars.WEBAPP_PUBLISH_DIR }}"

      - name: Create EF Core bundle - ApplicationDbContext
        run: |
          mkdir -p "${{ vars.PUBLISH_ROOT_DIR }}/${{ vars.DOTNET_EF_BUNDLE_DIR }}"
          dotnet ef migrations bundle --self-contained --configuration Release --no-build \
            -o "${{ vars.PUBLISH_ROOT_DIR }}/${{ vars.DOTNET_EF_BUNDLE_DIR }}/${{ vars.DOTNET_EF_BUNDLE_NAME_APPDBCTX }}" \
            -p ./src/MH.Capstone.Domain -s ./src/MH.Capstone.WebApp -c ApplicationDbContext

      - name: Create EF Core bundle - CacheDbContext
        run: |
          dotnet ef migrations bundle --self-contained --configuration Release --no-build \
            -o "${{ vars.PUBLISH_ROOT_DIR }}/${{ vars.DOTNET_EF_BUNDLE_DIR }}/${{ vars.DOTNET_EF_BUNDLE_NAME_CACHEDBCTX }}" \
            -p ./src/MH.Capstone.Domain -s ./src/MH.Capstone.WebApp -c CacheDbContext

      - name: Upload publish artifact for deploy job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ vars.FILEPATH_SAFE_APPNAME }}_v${{ steps.get_build_version.outputs.version }}
          path: ./${{ vars.PUBLISH_ROOT_DIR }}
          retention-days: 1

  deploy:
    name: Deploy to Environment
    needs: [check_conditions, publish]
    if: >
      always() &&
      needs.check_conditions.outputs.should_deploy == 'true' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.check_conditions.outputs.deploy_env }}
    env:
      ASPNETCORE_ENVIRONMENT: Production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from publish job
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.publish.outputs.artifact_name }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZUREAPPSERVICE_APPNAME }}
          slot-name: 'Production'
          package: './${{ vars.WEBAPP_PUBLISH_DIR }}'

      - name: Deploy EF Core migration bundle - ApplicationDbContext
        if: ${{ success() }}
        run: |
          chmod +x ${{ vars.DOTNET_EF_BUNDLE_DIR }}/${{ vars.DOTNET_EF_BUNDLE_NAME_APPDBCTX }} &&
          ${{ vars.DOTNET_EF_BUNDLE_DIR }}/${{ vars.DOTNET_EF_BUNDLE_NAME_APPDBCTX }} --connection '${{ secrets.AZUREAPPSERVICE_DBCONNSTR }}' --verbose

      - name: Deploy EF Core migration bundle - CacheDbContext
        if: ${{ success() }}
        run: |
          chmod +x ${{ vars.DOTNET_EF_BUNDLE_DIR }}/${{ vars.DOTNET_EF_BUNDLE_NAME_CACHEDBCTX }} &&
          ${{ vars.DOTNET_EF_BUNDLE_DIR }}/${{ vars.DOTNET_EF_BUNDLE_NAME_CACHEDBCTX }} --connection '${{ secrets.AZUREAPPSERVICE_DBCONNSTR }}' --verbose

  auto_merge:
    name: Auto-Merge PR
    needs: [check_conditions, deploy]
    if: > 
      always() && 
      needs.check_conditions.outputs.should_deploy == 'true' && 
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge PR into base branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              merge_method: 'merge'
            });
            core.info(`PR #${prNumber} auto-merged after successful deployment.`);

  transition_jira:
    name: Transition Jira Issue to Merged
    needs: [check_conditions, auto_merge]
    if: > 
      always() && 
      needs.check_conditions.outputs.should_deploy == 'true' && 
      needs.auto_merge.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Extract Jira issue key from PR title or branch name
        id: jira
        run: |
          key=$(echo "${{ github.event.pull_request.title }}" | grep -oP '(?<=\[)[A-Z]+-[0-9]+(?=\])' | head -1)
          if [ -z "$key" ]; then
            key=$(echo "${{ github.head_ref }}" | grep -oE '[A-Z]+-[0-9]+' | head -1)
          fi
          if [ -z "$key" ]; then
            echo "No Jira issue key found in PR title or branch name — skipping transition"
          else
            echo "key=$key" >> "$GITHUB_OUTPUT"
            echo "Found Jira issue key: $key"
          fi

      - name: Transition issue to Merged
        if: steps.jira.outputs.key != ''
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Basic $(printf '%s:%s' '${{ secrets.JIRA_USER_EMAIL }}' '${{ secrets.JIRA_API_TOKEN }}' | base64 -w 0)" \
            -H "Content-Type: application/json" \
            -d '{"transition":{"id":"${{ vars.JIRA_TRANSITION_ID_MERGED }}"}}' \
            "${{ vars.JIRA_BASE_URL }}/rest/api/3/issue/${{ steps.jira.outputs.key }}/transitions" \
            || echo "000")
          echo "Jira API response status: $status"
          if [ "$status" != "204" ]; then
            echo "::warning::Jira transition returned HTTP $status for ${{ steps.jira.outputs.key }} — issue may already be in Merged state or the transition is unavailable from its current state"
          else
            echo "Successfully transitioned ${{ steps.jira.outputs.key }} to Merged"
          fi

  transition_jira_failure:
    name: Transition Jira Issue to PR Changes Requested
    needs: [check_conditions, test, publish, deploy]
    if: >
      always() &&
      needs.check_conditions.outputs.should_deploy == 'true' &&
      (needs.test.result == 'failure' ||
       needs.publish.result == 'failure' ||
       needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Extract Jira issue key from PR title or branch name
        id: jira
        run: |
          key=$(echo "${{ github.event.pull_request.title }}" | grep -oP '(?<=\[)[A-Z]+-[0-9]+(?=\])' | head -1)
          if [ -z "$key" ]; then
            key=$(echo "${{ github.head_ref }}" | grep -oE '[A-Z]+-[0-9]+' | head -1)
          fi
          if [ -z "$key" ]; then
            echo "No Jira issue key found in PR title or branch name — skipping transition"
          else
            echo "key=$key" >> "$GITHUB_OUTPUT"
            echo "Found Jira issue key: $key"
          fi

      - name: Transition issue to PR Changes Requested
        if: steps.jira.outputs.key != ''
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Basic $(printf '%s:%s' '${{ secrets.JIRA_USER_EMAIL }}' '${{ secrets.JIRA_API_TOKEN }}' | base64 -w 0)" \
            -H "Content-Type: application/json" \
            -d '{"transition":{"id":"${{ vars.JIRA_TRANSITION_ID_CHANGES_REQUESTED }}"}}' \
            "${{ vars.JIRA_BASE_URL }}/rest/api/3/issue/${{ steps.jira.outputs.key }}/transitions" \
            || echo "000")
          echo "Jira API response status: $status"
          if [ "$status" != "204" ]; then
            echo "::warning::Jira transition returned HTTP $status for ${{ steps.jira.outputs.key }} — issue may not be in a state that allows this transition"
          else
            echo "Successfully transitioned ${{ steps.jira.outputs.key }} to PR Changes Requested"
          fi

  comment_result:
    name: Comment PR Result
    needs: [check_conditions, test, publish, deploy, auto_merge]
    if: always() && needs.check_conditions.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      actions: read
    steps:
      - name: Post result comment to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const runUrl   = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const testResult    = '${{ needs.test.result }}';
            const publishResult = '${{ needs.publish.result }}';
            const deployResult  = '${{ needs.deploy.result }}';
            const mergeResult   = '${{ needs.auto_merge.result }}';

            const overallSuccess = mergeResult === 'success';

            let body;
            if (overallSuccess) {
              body = [
                '<!-- pr-deploy-comment -->',
                '## ✅ Deploy Pipeline Passed',
                '',
                'All tests passed. The PR has been deployed and auto-merged.',
                '',
                `**[View Run →](${runUrl})**`
              ].join('\n');
            } else {
              let failedStage = 'unknown stage';
              if      (testResult    === 'failure') failedStage = 'Full Test Suite';
              else if (publishResult === 'failure') failedStage = 'Publish';
              else if (deployResult  === 'failure') failedStage = 'Deploy to Environment';
              else if (mergeResult   === 'failure') failedStage = 'Auto-Merge PR';

              // Attempt to find the specific failed job URL
              let jobUrl = runUrl;
              try {
                const { data } = await github.rest.actions.listJobsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: context.runId,
                  filter: 'all'
                });
                const failedJob = data.jobs.find(j => j.conclusion === 'failure');
                if (failedJob) jobUrl = failedJob.html_url;
              } catch (err) {
                core.warning(`Could not fetch jobs list: ${err.message}`);
              }

              body = [
                '<!-- pr-deploy-comment -->',
                `## ❌ Deploy Pipeline Failed — ${failedStage}`,
                '',
                `The pipeline failed at the **${failedStage}** stage. Please fix the issues and re-request review.`,
                '',
                `**[View Run →](${runUrl})** | **[View Failed Job →](${jobUrl})**`
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body
            });
            core.info(`Posted ${overallSuccess ? 'success' : 'failure'} comment on PR #${prNumber}`);

  release:
    name: Create GitHub Release
    needs: [check_conditions, publish, auto_merge]
    if: > 
      always() &&
      needs.check_conditions.outputs.should_deploy == 'true' && 
      needs.auto_merge.result == 'success'
    runs-on: ubuntu-latest
    env:
      ARTIFACT_ZIP_NAME: ${{ needs.publish.outputs.artifact_name }}.zip
    permissions:
      contents: write
    steps:
      - name: Download artifact from publish job
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.publish.outputs.artifact_name }}
          path: app

      - name: Zip artifact for release
        run: zip -r ${{ env.ARTIFACT_ZIP_NAME }} ./app

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ needs.check_conditions.outputs.is_prerelease }}
          name: ${{ needs.publish.outputs.version }}
          tag_name: ${{ needs.publish.outputs.version }}
          generate_release_notes: true
          files: ${{ env.ARTIFACT_ZIP_NAME }}
          target_commitish: ${{ github.sha }}
