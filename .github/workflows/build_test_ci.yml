name: Build and Test (CI)

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      deploy:
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      deploy:
        required: true
        type: boolean
        default: false
    outputs:
      version:
        description: "The version number from the build and that was assigned to the build"
        value: ${{ jobs.buildtest.outputs.version }}
      artifcat_name:
        description: "The name of the file uploaded to the artifcat server from dotnet publish"
        value: ${{ jobs.buildtest.outputs.artifact_name }}
      artifact_id:
        description: "The id of the file uploaded to the artifcat server from dotnet publish"
        value: ${{ jobs.buildtest.outputs.artifact_id }}

jobs:
  #This is run in a seperate job to ensure clean code and seperation between database checks and other dotnet checks,
  #which before was cauing strange errors when run in the same job
  validate-ef:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef --version ${{ vars.DOTNET_EF_VERSION }}

      - name: Restore with dotnet
        run: dotnet restore ./src --verbosity normal

      - name: Build with dotnet
        run: dotnet build ./src --no-restore --configuration Release --verbosity normal

      - name: Ensure no missing EF Migrations
        #env:
          #ConnectionStrings__DataDb: ${{ secrets.EFCORE_FAKE_DBCONNSTR }}
          #ConnectionStrings__DefaultConnection: ${{ secrets.EFCORE_FAKE_DBCONNSTR }}
        run: |
          MIGRATION_NAME="__AutoCheck"
          MIGRATION_STARTUP="./src/MH.Capstone.WebApp"
          MIGRATION_PROJ="./src/MH.Capstone.Domain"
          MIGRATION_CONTEXT="ApplicationDbContext"
          MIGRATIONS_FOLDER="./src/MH.Capstone.Domain/Migrations"
          EXIT_CODE=0
          # Run the add migration command. Specify the startup project and context if needed.
          dotnet ef migrations add $MIGRATION_NAME --no-build --configuration Release -p $MIGRATION_PROJ -s $MIGRATION_STARTUP -c $MIGRATION_CONTEXT
          echo "Running migration file check on path: '${MIGRATIONS_FOLDER}/*_${MIGRATION_NAME}.cs' (excluding '*.Designer.cs')"

          # Check if the generated file contains any operations (e.g., migrationBuilder.)
          if grep -q "migrationBuilder\." ${MIGRATIONS_FOLDER}/*_${MIGRATION_NAME}.cs --exclude=*.Designer.cs; then
              echo "⚠️ Uncommitted model changes detected. A migration file is missing."
              EXIT_CODE=1
          else
              echo "✅ Your model matches the last migration snapshot. No missing migrations."
          fi

          # Clean up the temporary file
          dotnet ef migrations remove --force --no-build --configuration Release -p $MIGRATION_PROJ -s $MIGRATION_STARTUP -c $MIGRATION_CONTEXT
          # Restore all modified files from EF Core check, including new, untracked files (clean)
          git restore . && git clean -fd
          exit $EXIT_CODE
  
  buildtest:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
    outputs:
      version: ${{ steps.release_version.outputs.version }}
      artifact_name: ${{ steps.artifact_name.outputs.name }}
      artifact_id: ${{ steps.artifact_upload.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef --version ${{ vars.DOTNET_EF_VERSION }}

      - name: Get version number
        id: release_version
        run: echo "version=$(date +%Y).$(date +%-m).${{ github.run_number }}.${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Restore with dotnet
        run: dotnet restore ./src --verbosity normal

      - name: Build with dotnet
        run: dotnet build ./src --no-restore --configuration Release --verbosity normal -p:Version=${{ steps.release_version.outputs.version }}
      
      - name: Test with dotnet
        run: dotnet test ./src --no-restore --no-build --configuration Release --verbosity normal

      #TODO - Add Jest testing once implemented

      - name: Publish with dotnet
        run: dotnet publish ./src/MH.Capstone.WebApp --no-restore --no-build --configuration Release --verbosity normal -o "${{ vars.DOTNET_ROOT }}/myapp"

      - name: Create EF Core bundle
        if: inputs.deploy
        run: |
          dotnet ef migrations bundle --self-contained --configuration Release --no-build -o "${{ vars.DOTNET_ROOT }}/myapp/${{ vars.DOTNET_EF_BUNDLE_NAME }}" \
          -p ./src/MH.Capstone.Domain -s ./src/MH.Capstone.WebApp -c ApplicationDbContext
      
      - name: Get artifact name
        id: artifact_name
        run: echo "name=${{ vars.DOTNET_PUBLISH_UPLOAD_NAME }}-${{ steps.release_version.outputs.version }}" >> "$GITHUB_OUTPUT"
      
      - name: Upload build artifact for other jobs
        id: artifact_upload
        uses: actions/upload-artifact@v4
        if: inputs.deploy
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: ${{ vars.DOTNET_ROOT }}/myapp