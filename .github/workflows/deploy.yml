# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core WebApp to Azure App Services

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'jmcshane22/MonmouthHoldemCapstone'
    uses: ./.github/workflows/build_test_ci.yml
    with:
      deploy: true

  config:
    if: github.repository == 'jmcshane22/MonmouthHoldemCapstone'
    runs-on: ubuntu-latest
    env:
      prod_env: azure_prod
      staging_env: azure_staging
    outputs:
      deploy_env: ${{ steps.output_configs.outputs.deploy_env }}
      is_prerelease: ${{ steps.output_configs.outputs.is_prerelease }}
      
    steps:
      - name: Set config values for PROD (branch main)
        if: github.ref_name == 'main'
        id: config_prod
        run: |
          echo "::notice::Deployment being configured under PROD. Branch name is ${{ github.ref_name }}";
          echo "ISPRE=false" >> "$GITHUB_ENV";
          echo "DENV=${{ env.prod_env }}" >> "$GITHUB_ENV";
      
      - name: Set config values for STAGING (branch dev)
        if: github.ref_name == 'dev'
        id: config_staging
        run: |
          echo "::notice::Deployment being configured under STAGING. Branch name is ${{ github.ref_name }}";
          echo "ISPRE=true" >> "$GITHUB_ENV";
          echo "DENV=${{ env.staging_env }}" >> "$GITHUB_ENV";

      - name: Output config values
        if: always()
        id: output_configs
        run: |
          echo "is_prerelease=${{ env.ISPRE }}" >> "$GITHUB_OUTPUT";
          echo "deploy_env=${{ env.DENV }}" >> "$GITHUB_OUTPUT";

  release:
    if: github.repository == 'jmcshane22/MonmouthHoldemCapstone'
    runs-on: ubuntu-latest
    needs: [build,config]
    env:
      ARTIFACT_ZIP_NAME: ${{ needs.build.outputs.artifcat_name }}.zip
    permissions:
      contents: write #This is required for the release action
      
    steps:
      - name: Download artifact from build job
        id: artifact_download
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifcat_name }}
          path: app

      - name: Zip artifact for release
        run: zip -r ${{ env.ARTIFACT_ZIP_NAME }} ./app

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ needs.config.outputs.is_prerelease }}
          name: ${{ needs.build.outputs.version }}
          tag_name: ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: ${{ env.ARTIFACT_ZIP_NAME }}
          target_commitish: ${{ github.sha }}

  deploy:
    if: github.repository == 'jmcshane22/MonmouthHoldemCapstone'
    runs-on: ubuntu-latest
    needs: [build,config]
    environment:
      name: ${{ needs.config.outputs.deploy_env }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifcat_name }}
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZUREAPPSERVICE_APPNAME }}
          slot-name: 'Production'
          package: .

      - name: Deploy EF Core migration bundle - ApplicationDbContext
        id: deploy-application-db-ctx
        if: ${{ success() }}
        run: |
          chmod +x ${{ vars.DOTNET_EF_BUNDLE_NAME_APPDBCTX }} &&
          ${{ vars.DOTNET_EF_BUNDLE_NAME_APPDBCTX }} --connection '${{ secrets.AZUREAPPSERVICE_DBCONNSTR }}' --verbose

      - name: Deploy EF Core migration bundle - CacheDbContext
        id: deploy-cache-db-ctx
        if: ${{ success() }}
        run: |
          chmod +x ${{ vars.DOTNET_EF_BUNDLE_NAME_CACHEDBCTX }} &&
          ${{ vars.DOTNET_EF_BUNDLE_NAME_CACHEDBCTX }} --connection '${{ secrets.AZUREAPPSERVICE_DBCONNSTR }}' --verbose